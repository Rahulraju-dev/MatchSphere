<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register - MatchSphere</title>
  <link rel="stylesheet" href="register.css" />
</head>
<body>

  <div class="container">
    <h2>Create Account - MatchSphere</h2>
    <form id="registerForm" action="#" method="post" onsubmit="return false;">

      <label>Username</label>
      <input type="text" name="username" id="username" required />

      <label>Email</label>
      <input type="email" name="email" id="email" required />

      <label>Gender</label>
      <select id="gender" name="gender" required>
        <option value="">Select gender</option>
        <option value="MALE">Male</option>
        <option value="FEMALE">Female</option>
        <option value="OTHER">Other</option>
      </select>

      <label>Age</label>
      <input type="number" id="age" min="18" max="100" required />

      <label>Interests (comma-separated)</label>
      <input type="text" id="interests" />
          
      <label>Phone Number</label>
      <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" required />


      <label>Password</label>
      <input type="password" id="password" required />

      <button type="submit">Register</button>
    </form>

    <p class="link">Already have an account? <a href="login.html">Login</a></p>
  </div>

  <!-- Make sure this path is correct -->
  <script src="js/register.js"></script>
</body>
</html>
